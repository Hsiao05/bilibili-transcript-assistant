[project]
name = "bili-transcript-task-api"
version = "0.1.0"
description = "Local/remote task service for the Bilibili transcript assistant"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
# PyAV 19 dropped the metadata_errors argument used by faster-whisper 1.2.x; pin below 14.
asr = ["faster-whisper>=1.0,<2", "av>=13,<14"]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1",
]

[project.scripts]
taskapi-serve = "taskapi.serve:main"
taskapi-worker = "taskapi.worker:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["taskapi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"
